[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ERA",
]
ignore = [
    "E501",  # line too long: enforced by formatter, not checker
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["classifier", "summarizer"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
