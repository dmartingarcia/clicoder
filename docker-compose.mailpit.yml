services:
  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: 500
    networks: [clicoder]

  backend:
    depends_on:
      mailpit:
        condition: service_started
    environment:
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
