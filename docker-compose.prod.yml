# Las NEXT_PUBLIC_* se inlinan en build: no son runtime.

services:
  db:
    ports: !reset []

  training:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      - AI_ADMIN_TOKEN=${AI_ADMIN_TOKEN:?AI_ADMIN_TOKEN no definido en .env}
      - TRUST_PROXY_HEADERS=true

  ai_engine:
    ports: !reset []
    environment:
      - AI_ADMIN_TOKEN=${AI_ADMIN_TOKEN:?AI_ADMIN_TOKEN no definido en .env}

  frontend:
    ports: !reset []
    build:
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
