services:
  traefik:
    image: traefik:v3.7.1
    container_name: cie10_traefik
    restart: always
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=clicoder"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--metrics.prometheus=true"
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus.entrypoint=metrics"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/letsencrypt:/letsencrypt
      - /var/log/traefik:/var/log/traefik
    networks: [proxy, clicoder]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth,dashboard-ratelimit"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
      - "traefik.http.middlewares.dashboard-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.dashboard-ratelimit.ratelimit.burst=20"
      - "traefik.http.middlewares.dashboard-ratelimit.ratelimit.period=1m"

  # Fallback si el frontend cae: prioridad 1 frente a 10 del frontend
  maintenance:
    image: nginx:1.27-alpine
    container_name: cie10_maintenance
    restart: always
    volumes:
      - ./docker/maintenance:/usr/share/nginx/html:ro
    networks: [proxy, clicoder]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maintenance.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.maintenance.entrypoints=websecure"
      - "traefik.http.routers.maintenance.tls=true"
      - "traefik.http.routers.maintenance.tls.certresolver=letsencrypt"
      - "traefik.http.routers.maintenance.priority=1"
      - "traefik.http.services.maintenance.loadbalancer.server.port=80"

  # Rutas (DOMAIN, api.DOMAIN, grafana.DOMAIN) en el panel de Cloudflare hacia https://cie10_traefik:443 con noTLSVerify
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    container_name: cie10_cloudflared
    restart: always
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [clicoder]

networks:
  proxy:
  clicoder:
    external: true
