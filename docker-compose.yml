services:
  # Imagen base compartida para ML (CUDA + PyTorch + Transformers)
  ml-base:
    build:
      context: .
      dockerfile: Dockerfile.ml-base
    image: cie10-ml-base:latest

  # Email catcher: Mailpit (SMTP + Web UI)
  mailpit:
    image: axllent/mailpit:latest
    container_name: cie10_mailpit
    restart: always
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: 500

  # Base de Datos: PostgreSQL (Doble propósito: App y EventStore)
  db:
    image: postgres:18-alpine
    container_name: cie10_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Entrenamiento: Python + PyTorch + Jupyter
  training:
    build:
      context: .
      dockerfile: training/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: cie10_training
    restart: always
    ports:
      - "${JUPYTER_PORT}:8888"
    volumes:
      - ./training/bert-classifier:/home/cie10user/bert-classifier
      - ./training/csv_import_scripts:/home/cie10user/csv_import_scripts
      - ./training/data_analysis:/home/cie10user/data_analysis
      - ./ai_engine/model:/home/cie10user/projects/ai_engine/model
      - ./.huggingface_cache:/home/cie10user/.cache/huggingface
    stdin_open: true
    tty: true
    depends_on:
      - ml-base
    env_file:
      - .env
    command: bash

  # Microservicio de IA: FastAPI + Transformers
  ai_engine:
    build:
      context: .
      dockerfile: ai_engine/Dockerfile
    container_name: ai_engine
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${AI_ENGINE_PORT}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - SUMMARIZER_MODEL=${SUMMARIZER_MODEL:-none}
      - SUMMARIZER_THREADS=${SUMMARIZER_THREADS:-4}
      - PYTHONUNBUFFERED=1
      - SENTRY_DSN_AI=${SENTRY_DSN_AI:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-development}
    volumes:
      - ./ai_engine:/app
      - ./training/csv_import_scripts:/data
      - ./.huggingface_cache:/root/.cache/huggingface

  # Backend: Elixir Phoenix + Commanded
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elixir_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      ai_engine:
        condition: service_started
    ports:
      - "${BACKEND_PORT}:4000"
    environment:
      - MIX_ENV=${MIX_ENV:-dev}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:changeme@db:5432/cie10_app}
      - EVENT_STORE_URL=${EVENT_STORE_URL:-postgresql://postgres:changeme@db:5432/cie10_eventstore}
      - AI_ENGINE_URL=${AI_ENGINE_URL:-http://ai_engine:8000}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-supersecretkeythatisatleast64byteslongforproductionuse}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - PGPASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - ./backend:/app
      - backend_build:/app/_build
      - backend_deps:/app/deps
      - ./training/csv_import_scripts/cie10-csvs:/data/cie10-csvs:ro

  # Monitorización: Prometheus (métricas) + Grafana (dashboards)
  prometheus:
    image: prom/prometheus:latest
    container_name: cie10_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"

  grafana:
    image: grafana/grafana:latest
    container_name: cie10_grafana
    restart: always
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # Frontend: Next.js + Tailwind + shadcn
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: nextjs_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
      - ./frontend/.next:/app/.next
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  backend_build:
  backend_deps:
  prometheus_data:
  grafana_data:
