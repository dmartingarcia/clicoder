services:
  # Imagen base compartida para ML (CUDA + PyTorch + Transformers)
  ml-base:
    build:
      context: .
      dockerfile: Dockerfile.ml-base
    image: cie10-ml-base:latest

  # Email catcher: Mailpit (SMTP + Web UI)
  mailpit:
    image: axllent/mailpit:latest
    container_name: cie10_mailpit
    restart: always
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: 500
    networks: [ciecoder]

  # Base de Datos: PostgreSQL (Doble propósito: App y EventStore)
  db:
    image: postgres:18-alpine
    container_name: cie10_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ciecoder]

  # Entrenamiento: Python + PyTorch + Jupyter
  training:
    build:
      context: .
      dockerfile: training/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: cie10_training
    restart: always
    ports:
      - "${JUPYTER_PORT}:8888"
    volumes:
      - ./training/bert-classifier:/home/cie10user/bert-classifier
      - ./training/csv_import_scripts:/home/cie10user/csv_import_scripts
      - ./training/data_analysis:/home/cie10user/data_analysis
      - ./ai_engine/model:/home/cie10user/projects/ai_engine/model
      - ./.huggingface_cache:/home/cie10user/.cache/huggingface
    stdin_open: true
    tty: true
    depends_on:
      - ml-base
    env_file:
      - .env
    command: bash

  # Microservicio de IA: FastAPI + Transformers
  ai_engine:
    build:
      context: .
      dockerfile: ai_engine/Dockerfile
    container_name: ai_engine
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${AI_ENGINE_PORT}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - PYTHONUNBUFFERED=1
      - SENTRY_DSN_AI=${SENTRY_DSN_AI:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-development}
      - SUMMARIZER_MODEL=${SUMMARIZER_MODEL:-none}
      - SUMMARIZER_THREADS=${SUMMARIZER_THREADS:-4}
    volumes:
      - ./ai_engine:/app
      - ./training/csv_import_scripts:/data
      - ./.huggingface_cache:/root/.cache/huggingface
    networks: [ciecoder]

  # Backend: Elixir Phoenix + Commanded
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elixir_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      ai_engine:
        condition: service_started
    ports:
      - "${BACKEND_PORT}:4000"
    environment:
      - AI_ENGINE_URL=${AI_ENGINE_URL:?AI_ENGINE_URL no definido en .env}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS no definido en .env}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL no definido en .env}
      - DOMAIN=${DOMAIN:?DOMAIN no definido en .env}
      - EVENT_STORE_URL=${EVENT_STORE_URL:?EVENT_STORE_URL no definido en .env}
      - MAILJET_API_KEY=${MAILJET_API_KEY:-}
      - MAILJET_SECRET_KEY=${MAILJET_SECRET_KEY:-}
      - MIX_ENV=${MIX_ENV:?MIX_ENV no definido en .env}
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD no definido en .env}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER no definido en .env}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?SECRET_KEY_BASE no definido en .env}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL no definido en .env}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD no definido en .env}
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - ./backend:/app
      - backend_build:/app/_build
      - backend_deps:/app/deps
      - ./training/csv_import_scripts/cie10-csvs:/data/cie10-csvs:ro
    networks: [ciecoder]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=4000"

  # Frontend: Next.js + Tailwind + shadcn
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:3000"
    networks: [ciecoder]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  backend_build:
  backend_deps:

networks:
  ciecoder:
    external: true
