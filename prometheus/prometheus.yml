global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "backend"
    static_configs:
      - targets: ["elixir_backend:9568"]
    metrics_path: /metrics

  - job_name: "ai_engine"
    static_configs:
      - targets: ["ai_engine:8000"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
