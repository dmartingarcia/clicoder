global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "backend"
    static_configs:
      - targets: ["elixir_backend:9568"]
    metrics_path: /metrics

  - job_name: "ai_engine"
    static_configs:
      - targets: ["ai_engine:8000"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: "traefik"
    static_configs:
      - targets: ["cie10_traefik:8082"]
    metrics_path: /metrics

  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://elixir_backend:4000/api/health"]
        labels:
          service: backend
      - targets: ["http://nextjs_frontend:3000/api/health"]
        labels:
          service: frontend
      - targets: ["http://ai_engine:8000/"]
        labels:
          service: ai_engine
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
