name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Commit lint ─────────────────────────────────────────────────────────────
  commitlint:
    name: Commit lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ── Frontend: lint & build ───────────────────────────────────────────────
  frontend-lint:
    name: Frontend, lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type-check included)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
          NEXT_PUBLIC_WS_URL: ws://localhost:4000/socket

  # ── Frontend: test with coverage ─────────────────────────────────────────
  frontend-test:
    name: Frontend, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Coverage summary → step summary
        if: always()
        run: |
          echo "## Frontend Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const fs = require('fs');
              const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const entries = Object.entries(summary).filter(([k]) => k !== 'total');
              const total = summary.total;
              const bar = (pct) => pct >= 80 ? '🟢' : pct >= 50 ? '🟡' : '🔴';
              const fmt = (x) => (x.pct ?? 0).toFixed(1) + '%';

              console.log('| File | Stmts | Branch | Funcs | Lines |');
              console.log('|------|------:|-------:|------:|------:|');
              entries
                .sort((a, b) => (b[1].lines.pct ?? 0) - (a[1].lines.pct ?? 0))
                .forEach(([path, s]) => {
                  const name = path.replace(/.*\/src\//, '');
                  const p = s.lines.pct ?? 0;
                  console.log('| \`' + name + '\` | ' + fmt(s.statements) + ' | ' + fmt(s.branches) + ' | ' + fmt(s.functions) + ' | ' + bar(p) + ' ' + fmt(s.lines) + ' |');
                });
              console.log('| **Total** | **' + fmt(total.statements) + '** | **' + fmt(total.branches) + '** | **' + fmt(total.functions) + '** | **' + fmt(total.lines) + '** |');
            " >> $GITHUB_STEP_SUMMARY || true
          fi

  # ── Backend: format, compile & static analysis ───────────────────────────
  backend-lint:
    name: Backend, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: backend/deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('backend/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-deps-

      - name: Cache build (dev)
        uses: actions/cache@v4
        with:
          path: backend/_build/dev
          key: ${{ runner.os }}-mix-build-dev-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-build-dev-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Cache Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: |
            backend/_build/dev/*.plt
            backend/_build/dev/*.plt.hash
          key: ${{ runner.os }}-dialyzer-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Static analysis (Credo)
        run: mix credo --strict

      - name: Static analysis (Dialyzer)
        run: mix dialyzer --format dialyxir
        env:
          MIX_ENV: dev

  # ── Backend: test with coverage ──────────────────────────────────────────
  backend-test:
    name: Backend, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cie10_app_test
      TEST_EVENT_STORE_URL: postgresql://postgres:postgres@localhost:5432/cie10_eventstore_test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('backend/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Set up test databases
        run: |
          mix ecto.create
          mix ecto.migrate
          mix event_store.create
          mix event_store.init

      - name: Test with coverage
        run: mix coveralls.html 2>&1 | tee /tmp/coveralls_output.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/cover/
          retention-days: 14

      - name: Coverage summary → step summary
        if: always()
        run: |
          echo "## Backend Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f cover/excoveralls.json ]; then
            node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('cover/excoveralls.json', 'utf8'));
              const files = data.source_files ?? [];
              const rows = files.map(f => {
                const cov = f.coverage ?? [];
                const relevant = cov.filter(x => x !== null);
                const covered = relevant.filter(x => x > 0);
                const pct = relevant.length ? (covered.length / relevant.length * 100).toFixed(1) : '0.0';
                const name = f.name.replace(/^lib\//, '');
                return { name, pct: parseFloat(pct), relevant: relevant.length, covered: covered.length };
              }).filter(r => r.relevant > 0).sort((a,b) => b.pct - a.pct);

              const total = rows.reduce((acc, r) => ({ cov: acc.cov + r.covered, rel: acc.rel + r.relevant }), { cov: 0, rel: 0 });
              const totalPct = total.rel ? (total.cov / total.rel * 100).toFixed(1) : '0.0';

              console.log('| File | Lines | Covered | % |');
              console.log('|------|------:|--------:|--:|');
              rows.forEach(r => {
                const bar = r.pct >= 80 ? '🟢' : r.pct >= 50 ? '🟡' : '🔴';
                console.log('| \`' + r.name + '\` | ' + r.relevant + ' | ' + r.covered + ' | ' + bar + ' ' + r.pct + '% |');
              });
              console.log('| **TOTAL** | **' + total.rel + '** | **' + total.cov + '** | **' + totalPct + '%** |');
            " >> $GITHUB_STEP_SUMMARY || true
          fi

  # ── AI Engine ────────────────────────────────────────────────────────────────
  ai-engine:
    name: AI Engine, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint ai_engine
        run: ruff check ai_engine/

      - name: Lint ai_engine_mock
        run: ruff check ai_engine_mock/

      - name: Format check ai_engine
        run: ruff format --check ai_engine/

      - name: Format check ai_engine_mock
        run: ruff format --check ai_engine_mock/

  # ── TFG: compila y publica ────────────────────────────────────────────────
  tfg:
    name: TFG, compila memoria
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compilar TFG
        run: make tfg-lint

      - name: Publicar PDF como release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tfg-latest
          name: TFG (build automático)
          body: PDF compilado automáticamente desde ${{ github.sha }}
          make_latest: false
          files: tfg/build/uclmTFGesi.pdf

  # ── End to end ───────────────────────────────────────────────────────────────
  e2e:
    name: End to end, flujos basicos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El navegador pesa unos 170 MB y compilar el entorno cuesta mas que los propios tests.
      - name: Cache del entorno de Playwright
        uses: actions/cache@v4
        with:
          path: |
            e2e/.venv
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-e2e-${{ hashFiles('e2e/requirements.txt') }}
          restore-keys: ${{ runner.os }}-e2e-

      # Las librerias de sistema de Chromium van por apt, asi que no entran en el cache.
      - name: Dependencias de sistema de Chromium
        run: |
          python -m venv e2e/.venv
          e2e/.venv/bin/pip install -q -r e2e/requirements.txt
          sudo e2e/.venv/bin/playwright install-deps chromium

      - name: Configurar el entorno
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY_BASE=.*|SECRET_KEY_BASE=$(openssl rand -base64 48)|" .env

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagenes de la app (cache en GHCR)
        env:
          COMPOSE_PROJECT_NAME: cie-10
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx bake -f docker-compose.yml -f docker-compose.mock.yml backend frontend ai_engine \
            --load \
            --set backend.tags=cie-10-backend \
            --set backend.cache-from=type=registry,ref=ghcr.io/$REPO_LC/cache-backend \
            --set backend.cache-to=type=registry,ref=ghcr.io/$REPO_LC/cache-backend,mode=max \
            --set frontend.tags=cie-10-frontend \
            --set frontend.cache-from=type=registry,ref=ghcr.io/$REPO_LC/cache-frontend \
            --set frontend.cache-to=type=registry,ref=ghcr.io/$REPO_LC/cache-frontend,mode=max \
            --set ai_engine.tags=cie-10-ai_engine \
            --set ai_engine.cache-from=type=registry,ref=ghcr.io/$REPO_LC/cache-ai-engine \
            --set ai_engine.cache-to=type=registry,ref=ghcr.io/$REPO_LC/cache-ai-engine,mode=max

      - name: Levantar base de datos y correo
        run: |
          make network-create
          docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d --wait db mailpit

      - name: Cache de deps del backend
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-e2e-backend-${{ hashFiles('backend/mix.lock') }}
          restore-keys: ${{ runner.os }}-e2e-backend-

      - name: Preparar la base de datos
        run: |
          sudo chown -R 1000:1000 backend
          docker compose -f docker-compose.yml -f docker-compose.mock.yml run --rm --no-deps backend \
            sh -c "mix deps.get && mix deps.compile && mix ecto.create && mix ecto.migrate && mix event_store.create && mix event_store.init && mix run priv/repo/seeds.exs"

      - name: Levantar la aplicacion con el motor simulado
        run: |
          docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d --wait ai_engine backend frontend

      - name: Tests de extremo a extremo
        run: make e2e-tests

      - name: Logs de los servicios si algo falla
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml logs --tail 200
