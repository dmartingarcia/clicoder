# docker-compose.dev.yml
# Override para desarrollo: frontend con hot reload y volúmenes montados.
# Uso: incluido automáticamente en make up / make cpu-up

services:
  frontend:
    build:
      target: dev
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - NODE_ENV=development
      - NPM_CONFIG_CACHE=/app/.npm-cache
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/.npm-cache
      - ./frontend/node_modules:/app/node_modules
      - ./frontend/.next:/app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    stdin_open: true
    tty: true

  ai_engine:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app --timeout-keep-alive 75
