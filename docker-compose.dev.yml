# docker-compose.dev.yml
# Override para desarrollo: frontend con hot reload y volúmenes montados.
# Uso: incluido automáticamente en make up / make cpu-up

services:
  frontend:
    build:
      target: dev
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - NODE_ENV=${NODE_ENV}
      - NPM_CONFIG_CACHE=/app/.npm-cache
    volumes:
      - ./frontend:/app
      - /app/.npm-cache
      - ./frontend/node_modules:/app/node_modules
      - ./frontend/.next:/app/.next
    stdin_open: true
    tty: true
