services:
  ai_engine:
    build:
      args:
        BUILD_WITH_CUDA: "1"
    # Sin esto la imagen se compila con CUDA pero el servicio arranca igualmente en CPU, porque
    # el Dockerfile deja DEVICE=cpu por defecto. El sintoma no es un error: el motor funciona,
    # solo que la atribucion pasa de medio segundo a diez y la tarjeta se queda sin usar.
    environment:
      - DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  training:
    build:
      args:
        BUILD_WITH_CUDA: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
