services:
  ai_engine:
    build:
      args:
        BUILD_WITH_CUDA: "1"
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
# Sin DEVICE=cuda el servicio arranca en CPU sin error (Dockerfile deja cpu por defecto):
# la atribucion pasa de 0,5 s a 10 s y la GPU queda sin usar.
    environment:
      - DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  training:
    build:
      args:
        BUILD_WITH_CUDA: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
